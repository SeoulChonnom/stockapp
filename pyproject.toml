[project]
name = "stockapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.14.2",
  "fastapi[standard]>=0.135.2",
  "greenlet>=3.2.4",
  "httpx>=0.28.1",
  # Floors track what is actually exercised: langchain-google-genai below 4.3
  # has no profile for the gemini-3.1 models this batch runs on, and both it
  # and langchain-core moved to 1.x/4.x together. The meta ``langchain``
  # package is deliberately absent -- nothing imports it, and it only pulls the
  # langgraph tree in behind it.
  "langchain-core>=1.5.4",
  "langchain-google-genai>=4.3.4",
  "pydantic-settings>=2.13.1",
  "PyJWT>=2.10.1",
  "psycopg[binary]>=3.2.12",
  "sqlalchemy>=2.0.44",
  # yfinance reads an API Yahoo does not publish, so an old release breaks
  # against a live endpoint rather than at import. The floor stays on a version
  # confirmed against the real endpoint, not merely against the mocked tests.
  "yfinance>=1.6.0",
  "exchange-calendars>=4.13.2",
  "alembic>=1.17.2",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
  "pyright>=1.1.411",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.15.12",
  "vulture>=2.16",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.vulture]
ignore_decorators = ["@app.*", "@router.*"]
ignore_names = ["visit_*", "do_*"]
make_whitelist = false
min_confidence = 80
paths = ["app/", "tests/", "main.py"]
sort_by_size = true
verbose = false

[tool.pyright]
include = ["app"]
venvPath = "."
venv = ".venv"
