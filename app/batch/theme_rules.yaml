# Human-reviewed definitions for the 40 active leaf themes.
#
# Inclusion/exclusion criteria are supplied to the production LLM prompt.
# Only the twenty rules with fallback.enabled=true are used by the deterministic
# classifier; every enabled rule has strong phrases and a score threshold of 6.

MACRO_ECONOMIC_DATA_INFLATION:
  inclusionCriteria:
    - 물가
    - 인플레이션
    - 소비자물가
    - CPI
    - 물가상승률
  exclusionCriteria:
    - 개별 종목 가격
    - 주가 상승
    - 원자재 단일 가격
  fallback:
    enabled: true
    minimumScore: 6
    strongPhrases:
      - 소비자물가지수
      - CPI 발표
    supportingTermGroups:
      - [물가, 인플레이션]
      - [소비자물가, 물가상승률]
    excludedPhrases:
      - 주가 상승
      - 개별 종목 가격

